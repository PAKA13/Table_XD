<style>

    box-shadow:inset 0 0 0 1px rgba(22,32,46,.25)}
  .part .nm{font-size:11.5px;color:var(--tx2)}

  
  #side{top:16px;left:16px;width:252px;padding:14px 16px;

function fichasDe(id){
  return /-m1$/.test(id)
    ? {rt:SOPORTE_RT_M1, inter:SOPORTE_INTER_M1, placa:PLACA_M1}
    : {rt:SOPORTE_RT,    inter:SOPORTE_INTER,    placa:PLACA_CAT};
}

function mallaRT(id, o, mat){
  const F = fichasDe(id);
  const ficha = /^inter/.test(id) ? F.inter : F.rt;
  const sop = construirSoporteRT(THREE, Object.assign({}, ficha, (o && o.soporte) || {}));
  const pla = construirPlacaRT(THREE, Object.assign({}, F.placa, (o && o.placa) || {}));
  const m = () => mat || new THREE.MeshStandardMaterial({color:ACERO, metalness:0.55, roughness:0.42});
  const base = new THREE.Mesh(sop.geo, m());
  base.userData.medidas = sop;
  base.userData.agujeros = [sop.agujero];
  base.userData.pie = sop.pie;
  const edit = new THREE.Mesh(pla.geo, m());
  edit.userData.medidas = pla;
  edit.userData.agujeros = [pla.agujero];
  return {base, edit, soporte:sop, placa:pla};
}

const loader = new GLTFLoader();

function loadPart(url){
  return new Promise((res, rej) => loader.load(url, gltf => {
    const root = gltf.scene;
    root.scale.setScalar(1000);                                          
    root.updateMatrixWorld(true);


    const cams = [];
    root.traverse(o => { if (o.isCamera) cams.push(o); });
    cams.forEach(c => c.removeFromParent());
    res(root);
  }, undefined, e => rej(new Error(url + ' — ' + (e.message || e)))));
}


function disposeTree(root){
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach(m => m.dispose());
  });
}




function findHoles(root){
  const out = [];
  for (const c of bordesVerticales(root)){
    const cx = c.reduce((s, p) => s + p.x, 0) / c.length;
    const cz = c.reduce((s, p) => s + p.z, 0) / c.length;
    const rs = c.map(p => Math.hypot(p.x - cx, p.z - cz));
    const r  = rs.reduce((a, b) => a + b, 0) / rs.length;
    if (r < 0.8) continue;
    if (Math.max(...rs.map(v => Math.abs(v - r))) > 0.35) continue;                   
    if (!haciaDentro(c, cx, cz)) continue;                                                
    out.push({cx, cz, r,
              ymin: Math.min(...c.map(p => p.y)),
              ymax: Math.max(...c.map(p => p.y))});
  }
  return out;
}






function findRanuras(root){
  const out = [];
  for (const c of bordesVerticales(root)){
    const cx = c.reduce((s, p) => s + p.x, 0) / c.length;
    const cz = c.reduce((s, p) => s + p.z, 0) / c.length;
    const rs = c.map(p => Math.hypot(p.x - cx, p.z - cz));
    const r  = rs.reduce((a, b) => a + b, 0) / rs.length;
    if (r < 0.8) continue;
    if (Math.max(...rs.map(v => Math.abs(v - r))) <= 0.35) continue;               
    if (!haciaDentro(c, cx, cz)) continue;
    const xs = c.map(p => p.x), zs = c.map(p => p.z);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const z0 = Math.min(...zs), z1 = Math.max(...zs);
    out.push({cx:(x0 + x1) / 2, cz:(z0 + z1) / 2,
              ancho: Math.min(x1 - x0, z1 - z0),
              largo: Math.max(x1 - x0, z1 - z0),
              ymin: Math.min(...c.map(p => p.y)),
              ymax: Math.max(...c.map(p => p.y))});
  }
  return out;
}



function haciaDentro(c, cx, cz){
  return c.filter(p => p.nx*(p.x-cx) + p.nz*(p.z-cz) < 0).length / c.length >= 0.85;
}




function bordesVerticales(root){
  const pts = [];
  root.updateMatrixWorld(true);
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry, P = g.attributes.position, N = g.attributes.normal;
    const nm = new THREE.Matrix3().getNormalMatrix(o.matrixWorld);
    const v = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < P.count; i++){
      n.fromBufferAttribute(N, i).applyMatrix3(nm).normalize();
      if (Math.abs(n.y) > 0.25) continue;
      v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld);
      pts.push({x:v.x, y:v.y, z:v.z, nx:n.x, nz:n.z});
    }
  });

  const par = pts.map((_, i) => i);
  const find = a => par[a] === a ? a : (par[a] = find(par[a]));
  for (let i = 0; i < pts.length; i++)
    for (let j = i + 1; j < pts.length; j++){
      if (Math.hypot(pts[i].x - pts[j].x, pts[i].z - pts[j].z) >= 2) continue;
      const a = find(i), b = find(j);
      if (a !== b) par[a] = b;
    }
  const groups = {};
  pts.forEach((p, i) => { (groups[find(i)] ||= []).push(p); });

  return Object.keys(groups).map(k => groups[k]).filter(c => c.length >= 8);
}


const DIMC = 0x4f7fd6, DIMK = 0xc76b30;



function makeDim(p0, p1, dir, off, tag, value, destaca, alza = 1.1){
  const g = new THREE.Group();
  const A = p0.clone().addScaledVector(dir, off);
  const B = p1.clone().addScaledVector(dir, off);
  const over = Math.max(1.5, off * 0.10);
  const gapv = Math.max(0.8, off * 0.05);

  const pts = [
    p0.clone().addScaledVector(dir, gapv), A.clone().addScaledVector(dir, over),
    p1.clone().addScaledVector(dir, gapv), B.clone().addScaledVector(dir, over),
    A, B,
  ];
  g.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: destaca ? DIMK : DIMC})));

  const el = document.createElement('div');
  el.className = 'dimlbl' + (destaca ? ' key' : '');
  el.innerHTML = `<i>${tag}</i>${value.toFixed(1)}`;
  const lbl = new CSS2DObject(el);
  lbl.position.copy(A).lerp(B, 0.5).addScaledVector(dir, over * alza);
  g.add(lbl);
  return g;
}

function makeNota(p0, dir, largo, tag, texto, destaca){

function makeAng(vert, dirRef, dirLado, largo, tag, grados, destaca){
  const a = dirRef.clone().normalize(), b = dirLado.clone().normalize();
  const eje = new THREE.Vector3().crossVectors(a, b);
  const tot = a.angleTo(b);
  if (tot < 1e-4 || eje.lengthSq() < 1e-12) return null;                 
  eje.normalize();

  const g = new THREE.Group();
  const pts = [
    vert.clone(), vert.clone().addScaledVector(a, largo),
    vert.clone(), vert.clone().addScaledVector(b, largo),
  ];
  const R = largo * 0.8, N = 24;
  let ant = null;
  for (let i = 0; i <= N; i++){
    const q = new THREE.Quaternion().setFromAxisAngle(eje, tot * i / N);
    const p = vert.clone().addScaledVector(a.clone().applyQuaternion(q), R);
    if (ant) pts.push(ant, p);
    ant = p;
  }
  g.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: destaca ? DIMK : DIMC})));

  const el = document.createElement('div');
  el.className = 'dimlbl' + (destaca ? ' key' : '');
  el.innerHTML = `<i>${tag}</i>${grados.toFixed(2)}°`;
  const lbl = new CSS2DObject(el);
  const medio = new THREE.Quaternion().setFromAxisAngle(eje, tot / 2);
  lbl.position.copy(vert).addScaledVector(a.clone().applyQuaternion(medio), R * 1.12);
  g.add(lbl);
  return g;
}

function clearDims(){
  for (const d of [dims, dimsA]){
    if (!d) continue;
    d.traverse(o => {
      if (o.isLineSegments){ o.geometry.dispose(); o.material.dispose(); }
      if (o.isCSS2DObject) o.element.remove();
    });
    d.removeFromParent();

  dims = null; dimsA = null;
}


function cajaPiezas(){
  const box = new THREE.Box3(), m = new THREE.Matrix4();
  asm.updateWorldMatrix(true, false);
  const inv = new THREE.Matrix4().copy(asm.matrixWorld).invert();
  for (const root of piezas)
    root.traverse(o => {
      if (!o.isMesh) return;
      o.updateWorldMatrix(true, false);
      o.geometry.computeBoundingBox();
      box.union(o.geometry.boundingBox.clone()
                 .applyMatrix4(m.copy(inv).multiply(o.matrixWorld)));
    });
  return box;
}

    const ARRIBA = V(0, 1, 0), ATRAS = V(0, 0, -1), IZQ = V(-1, 0, 0);

    g.add(makeDim(V(x0, b.alto, hw), V(x1, b.alto, hw), ARRIBA,

                  dimScale * 0.30, 'ala', b.pata));
    g.add(makeDim(V(b.largo - b.pata, 0, -hw), V(b.largo, 0, -hw), ATRAS,
                  dimScale * 0.30, 'ala', b.pata));
    g.add(makeDim(V(0, 0, -hw), V(b.largo, 0, -hw), ATRAS,
                  dimScale * 0.70, 'largo', b.largo));
    g.add(makeDim(V(0, 0, -hw), V(0, b.alto, -hw), IZQ,
                  dimScale * 0.30, 'alto', b.alto));
    holder.add(g);

  sAlto.input.oninput = () => { memoria.altoPE = +sAlto.input.value; rehacer(); };

  rehacer();
  frame();
}

async function montarBarraN(m, mia){
  destino = 'dimCtls';
  $('bPin').classList.remove('off');
  let tor, herr;
  try {
    const nombres = Object.keys(TORNILLERIA);
    const pares = await Promise.all(nombres.map(k => cargarTornilleria(k).then(p => [k, p])));
    tor = Object.fromEntries(pares);
    herr = {plana:tor['arandela-plana-1-4-corta'], ara:tor['arandela-presion-1-4'],
            tor:tor['perno-1-4x1-2']};
  } catch (e){
    if (mia === undefined || mia === epoca)
      fail(e.message + '  ·  Ábrelo por http://localhost/, no con doble clic.');
    return;
  }
  if (mia !== undefined && mia !== epoca) return;

  const matBarra = new THREE.MeshStandardMaterial({color:m.color, metalness:0.55, roughness:0.42});
  const matAis = new THREE.MeshStandardMaterial({color:AIS_COLOR, metalness:0.15, roughness:0.65});
  const celdas = nCeldas();
  const delTablero = !!memoria.nLayout;

  holder = new THREE.Group();
  asm.add(holder);
  card({color:m.color, label:m.etiqueta});
  card({color:AIS_COLOR, label:'Aislador 0.5/400 (Ø' + N_AIS_DIAM + ')'});

  const oLargo = filaInfo('Largo total' + (delTablero ? '' : ' (sin tablero)'));
  const oTor   = filaInfo('Tornillos');
  const sAis = addSlider(m.aislador.label, m.aislador.rango[0], m.aislador.rango[1],
                         30, true, m.aislador.clave);
  const oDev = filaDev(m.etiqueta);

  let grupo = null;

  function rehacer(){
    const H = +sAis.input.value;
    if (grupo){
      grupo.removeFromParent();
      grupo.traverse(o => { if (o.isMesh && (o.material === matBarra || o.material === matAis)) o.geometry.dispose(); });
    }
    grupo = new THREE.Group();
    holder.add(grupo);


    let L = 2 * N_EXT;
    for (const c of celdas) L += c.ancho;
    const ags = [{x:N_EXT / 2, z:0, r:6.35 / 2, punta:true},
                 {x:L - N_EXT / 2, z:0, r:6.35 / 2, punta:true}];
    let x = N_EXT;
    for (const c of celdas){
      ags.push({x:x + c.ancho / 2, z:c.dz, r:c.agujero / 2, celda:c});
      x += c.ancho;
    }



    const sh = new THREE.Shape();
    sh.moveTo(0, -N_ANCHO / 2); sh.lineTo(L, -N_ANCHO / 2);
    sh.lineTo(L, N_ANCHO / 2); sh.lineTo(0, N_ANCHO / 2); sh.closePath();
    for (const a of ags) agujeroEn(sh, a.x, -a.z, a.r);
    const barra = new THREE.Mesh(new THREE.ExtrudeGeometry(sh,
      {depth:N_ESP, bevelEnabled:false, curveSegments:24}), matBarra);
    barra.rotation.x = -Math.PI / 2;
    barra.position.y = H;
    grupo.add(barra);


    const aisl = [];
    for (const a of ags.filter(g => g.punta)){
      const sc = new THREE.Shape();
      sc.absarc(a.x, 0, N_AIS_DIAM / 2, 0, Math.PI * 2, false);
      agujeroEn(sc, a.x, 0, a.r);
      const ai = new THREE.Mesh(new THREE.ExtrudeGeometry(sc,
        {depth:H, bevelEnabled:false, curveSegments:32}), matAis);
      ai.rotation.x = -Math.PI / 2;
      grupo.add(ai);
      aisl.push(ai);
    }
    partMesh = barra; piezas = [barra].concat(aisl);



    if (pin) pin.removeFromParent();
    pin = new THREE.Group();
    for (const a of ags){
      if (a.punta){
        const arriba = new THREE.Group();
        apilar(arriba, herr, 0, 0, 0);
        arriba.position.set(a.x, H + N_ESP, 0);
        pin.add(arriba);
        const abajo = new THREE.Group();
        apilar(abajo, herr, 0, 0, 0);
        abajo.rotation.x = Math.PI;                                
        abajo.position.set(a.x, 0, 0);
        pin.add(abajo);
        continue;
      }
      const pila = PE_PILA[a.celda.pieza] || PE_PILA.tornillo;
      let y = H + N_ESP;
      for (const n of pila.arandelas){
        const pz = tor[n], ar = pz.o.clone();
        ar.position.set(a.x, y - pz.y0, a.z);
        pin.add(ar);
        y += pz.y1 - pz.y0;
      }
      const f = tor[pila.pieza].o.clone();
      f.position.set(a.x, y, a.z);
      pin.add(f);
    }
    pin.visible = $('bPin').classList.contains('on');
    holder.add(pin);

    holder.position.set(-L / 2, 0, 0);
    sAis.out.textContent = H.toFixed(1) + ' mm';
    oLargo.textContent = L.toFixed(1) + ' mm';
    oTor.textContent = celdas.length + ' en la barra · 4 pernos de aislador (2 arriba, 2 abajo)';

    g.add(makeDim(V(L, yT, -hw), V(L, yT, hw), V(1, 0, 0),
                  dimScale * 0.25, 'ancho', N_ANCHO));
    g.add(makeDim(V(-N_AIS_DIAM / 2 + N_EXT / 2, 0, 0), V(-N_AIS_DIAM / 2 + N_EXT / 2, H, 0), V(-1, 0, 0),
                  dimScale * 0.30, 'aislador', H));
    holder.add(g);
    dims = g;
    setDimsVisible($('bCota').classList.contains('on'));
  }

  sAis.input.oninput = () => { memoria[m.aislador.clave] = +sAis.input.value; rehacer(); };
  rehacer();
  frame();
}

function geometriaCatalogo(f, nBarras){
  const agujeros = [];
  for (let i = 0; i < nBarras; i++)
    agujeros.push({x:(i - (nBarras - 1) / 2) * f.paso, y:0, r:f.agujero / 2,
                   base:f.rebaje, cima:null});
  for (const sg of [-1, 1])
    agujeros.push({x:sg * f.fijacion, y:0, r:f.agujero / 2, base:null, cima:f.cajaFij});
  const nervios = [];
  if (f.nervios) for (const sg of [-1, 1]) for (const d of [-1, 1])
    nervios.push({x:sg * f.fijacion + d * f.nervios.desdeFij, y:0,
                  a:f.nervios.a, b:f.nervios.b, radio:f.nervios.radio, alto:f.nervios.alto});
  return construirAisladorBase(THREE, {
    x0:-f.largo / 2, y0:-f.ancho / 2, largo:f.largo, ancho:f.ancho, fondo:f.asiento,
    radio:f.radio, agujeros, nervios, segmentos:24}).geo;
}



const fichaCatalogo = nBarras =>
  (nBarras === 3) ? AIS_3F : (nBarras === 4) ? AIS_4F : null;

function agujeroEn(sh, cx, cy, r){
  const h = new THREE.Path();
  h.absarc(cx, cy, r, 0, Math.PI * 2, true);
  sh.holes.push(h);
}




function mallaAislador(ais, L, sep, nBarras, agsA, fondo, mat, pieza){
  const g = new THREE.Group();
  const opt = {depth:fondo, bevelEnabled:false, curveSegments:24};
  const filas = Math.min(ais.filas.length, agsA.length);



  if (pieza){
    const geo = geometriaCatalogo(pieza, nBarras);
    for (let k = 0; k < filas; k++){
      const c = new THREE.Mesh(geo, mat);
      c.position.set((nBarras - 1) * sep / 2, L - agsA[k].desdeArriba, 0);
      g.add(c);
    }
    g.position.z = -fondo;
    return g;
  }
  for (let k = 0; k < filas; k++){
    const cy = L - agsA[k].desdeArriba, rAg = agsA[k].r;
    if (ais.tipo === 'b'){







      const fij = (nBarras === 4) ? AIS_4F.fijacion : 0;
      const cxP = ais.left + ais.ancho / 2;
      const agujeros = [];
      for (let i = 0; i < nBarras; i++)
        agujeros.push({x:i * sep, y:cy, r:rAg, base:AIS_3F.rebaje, cima:null});
      if (fij) for (const sg of [-1, 1])
        agujeros.push({x:cxP + sg * fij, y:cy, r:rAg, base:null, cima:AIS_3F.cajaFij});
      const bloque = construirAisladorBase(THREE, {
        x0:ais.left, y0:L - ais.filas[k] - ais.alto, largo:ais.ancho, ancho:ais.alto,
        fondo, radio:AIS_RADIO, agujeros, segmentos:opt.curveSegments});
      g.add(new THREE.Mesh(bloque.geo, mat));
    } else {
      for (let i = 0; i < nBarras; i++){
        const sh = new THREE.Shape();
        sh.absarc(i * sep, cy, ais.diam / 2, 0, Math.PI * 2, false);
        agujeroEn(sh, i * sep, cy, rAg);
        g.add(new THREE.Mesh(new THREE.ExtrudeGeometry(sh, opt), mat));
      }
    }
  }
  g.position.z = -fondo;
  return g;
}

const PERNO_CONECTOR = 4.7625;


const PERNO_CONECTOR_M1 = 6.35;



const HERRAJE_CONECTOR = {
  '':   {ara:'arandela-presion-3-16', tor:'tornillo-3-16x3-8', plana:'arandela-plana-3-16-corta'},
  'M1': {ara:'arandela-presion-1-4',  tor:'perno-1-4x1-2',     plana:'arandela-plana-1-4-corta'}
};

const idConector = (porFase, c) =>
  porFase[c.fase] ? (porFase[c.fase] + (c.tipo === 'm1' ? '-m1' : '')) : null;
const canaDe = c => (c.tipo === 'm1') ? PERNO_CONECTOR_M1 : PERNO_CONECTOR;




async function plantillasConector(d, mia){
  const lista = d.conectores || [];


  const rieles = lista.filter(c => c.tipo === "r" || c.tipo === "m1");
  const vacio = {plant:{}, porFase:{}, ids:[], rieles:[],
                 sinModelo: lista.length - rieles.length,
                 idDe: () => null,
                 filasDe: () => []};
  if (!rieles.length) return vacio;







  const porNombre = {};
  for (const e of SISTEMAS[_iSis].modelos)
    for (const f of (e.cubre || [])) porNombre[f] = e.id;
  const canon = (d.fases.length === 4) ? ['R', 'S', 'T', 'N'] : ['R', 'S', 'T'];
  const porFase = {};
  if (d.fases.length === canon.length)
    d.fases.forEach((f, i) => { if (porNombre[canon[i]]) porFase[f] = porNombre[canon[i]]; });
  else Object.assign(porFase, porNombre);



  const ids = [];
  for (const c of rieles){
    const id = idConector(porFase, c);
    if (id && ids.indexOf(id) === -1) ids.push(id);
  }





  const plant = {};
  try {
    const herrDe = {};
    for (const fam of ['', 'M1']){
      if (!ids.some(id => (fam === 'M1') === /-m1$/.test(id))) continue;
      const H = HERRAJE_CONECTOR[fam];
      const [ara, tor, plana] = await Promise.all([
        cargarTornilleria(H.ara), cargarTornilleria(H.tor), cargarTornilleria(H.plana),
      ]);
      if (mia !== undefined && mia !== epoca) return vacio;
      herrDe[fam] = {ara, tor, plana};
    }
    for (const id of ids){
      plant[id] = await armarConector(porId(id), herrDe[/-m1$/.test(id) ? 'M1' : '']);
      if (mia !== undefined && mia !== epoca) return vacio;
    }
  } catch (e){
    fail(e.message + '  ·  Ábrelo por http://localhost/, no con doble clic.');
    return vacio;
  }

  const idDe = c => idConector(porFase, c);
  return {plant, porFase, ids, rieles,
          sinModelo: lista.length - rieles.length,
          idDe,


          filasDe: f => rieles.filter(c => c.fase === f && plant[idDe(c)])
                              .map(c => ({eje: c.eje, diam: canaDe(c)}))};
}








const CANA_PIE = window.Columna.CANA_PIE;                  
const TOPE_AGUJERO = window.Columna.TOPE_AGUJERO;     


function holguraPie(plant){
  const pie = plant.userData.pie;
  if (!pie) return 0;
  const largo = (typeof pie.largo === "number") ? pie.largo : pie.paso;
  return Math.max(0, (largo - CANA_PIE) / 2);
}


















function desfaseColumna(d, con){








  const piezas = d.fases.map(f => {
    const c = con.rieles.filter(q => q.fase === f)[0];
    return c ? (con.plant[con.idDe(c)] || null) : null;
  });
  const rep = window.Columna.reparto(
    piezas.map(pl => pl ? pl.userData.alcance : 0), d.sep,
    piezas.map(pl => pl ? holguraPie(pl) : 0));
  const m = new Map();
  d.fases.forEach((f, i) => { if (piezas[i]) m.set(f, rep[i]); });
  return m;
}









function ponerConectores(d, b, con, salida){
  const nota = n => (con.sinModelo
    ? (n + " con pieza · " + con.sinModelo + " sin modelo")
    : (n + " sobre las barras"));
  if (!con.rieles.length){ if (salida) salida.textContent = nota(0); return; }







  const desf = desfaseColumna(d, con);

  if (!pin){ pin = new THREE.Group(); holder.add(pin); }
  let puestos = 0;
  for (const c of con.rieles){
    const pl = con.plant[con.idDe(c)];
    const i = d.fases.indexOf(c.fase);
    if (!pl || i < 0 || !desf.has(c.fase)) continue;
    const q = desf.get(c.fase);

    const yEje = b.largo - c.eje;
    const puesto = plantarConector(pl, i * d.sep + q.agujero, yEje,
                                   b.espesor + alzada(b, yEje), q.lado, q.ranura);
    holder.add(puesto.cobre);
    if (puesto.herraje) pin.add(puesto.herraje);
    puestos++;
  }

  if (pin.children.length){
    pin.visible = $("bPin").classList.contains("on");
    $("bPin").classList.remove("off");                                     
  }

  for (const id of con.ids)
    if (con.plant[id]) card({color:porId(id).edit.color, label:porId(id).label});
  if (salida) salida.textContent = nota(puestos);

  if (desf.size){
    const fases = [...desf.keys()];

    const num = v => (Math.abs(v) < 0.05) ? "0.0"
                                         : ((v > 0 ? "+" : "") + v.toFixed(1));
    const fila = campo => fases.map(f => f + " " + num(desf.get(f)[campo])).join(" · ");
    filaInfo("A la columna").textContent = fila("falta") + " mm";
    if (fases.some(f => Math.abs(desf.get(f).agujero) >= 0.05))
      filaInfo("Agujero corrido").textContent =
        fila("agujero") + " mm · tope ±" + TOPE_AGUJERO.toFixed(1);
    const fuera = fases.filter(f => Math.abs(desf.get(f).sobra) > 0.05);
    if (fuera.length){
      const h = desf.get(fuera[0]).h;
      filaInfo("Aviso columna").textContent =
        fuera.map(f => f + " " + Math.abs(desf.get(f).sobra).toFixed(1)).join(" · ") +
        " mm sin llegar: el agujero da ±" + TOPE_AGUJERO.toFixed(1) +
        " y la ranura ±" + h.toFixed(1);
    }
  }
}

function cotasBarrasFase(b, d, m, ais, fondo, pieza){
  clearDims();
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const hw = b.ancho / 2, t = b.espesor, L = b.largo;
  const IZQ = V(-1, 0, 0), DER = V(1, 0, 0), ABAJO = V(0, -1, 0);
  const g = new THREE.Group();



  g.add(makeDim(V(-hw, 0, 0), V(-hw, L, 0), IZQ,
                dimScale * 0.55, "largo", L, true));





  const dimT = Math.max(6, 0.35 * Math.max(d.sep, b.ancho), 0.07 * L);
  g.add(makeDim(V(-hw, 0, 0), V(hw, 0, 0), ABAJO,
                dimT * 0.90, "ancho", b.ancho));


  if (b.escalon){
    const e = b.escalon, xE = -hw, yE = e.sube ? e.sube[1] : e.baja[0];
    g.add(makeDim(V(xE, yE, t), V(xE, yE, t + e.alto), IZQ,
                  dimT * 0.90, "escalón", e.alto));
  }
  if (d.fases.length > 1)
    g.add(makeDim(V(0, 0, 0), V(d.sep, 0, 0), ABAJO,
                  dimT * 2.10, "sep", d.sep));









  const ags = b.agujeros.filter(a => a.rol !== "t")
    .sort((p, q) => p.desdeArriba - q.desdeArriba);
  const offCad = i => dimScale * (i % 2 ? 0.52 : 0.30);
  let yAnt = L, i = 0;
  for (const a of ags){
    g.add(makeDim(V(hw, yAnt, 0), V(hw, a.y, 0), DER, offCad(i),
                  i === 0 ? "arriba" : "eje", yAnt - a.y));
    yAnt = a.y; i++;
  }
  if (yAnt > 0)
    g.add(makeDim(V(hw, yAnt, 0), V(hw, 0, 0), DER, offCad(i), "abajo", yAnt));




  const ARR = V(0, 1, 0);
  for (const {i: ib, bf} of barrasPorFase){
    const tAg = bf.agujeros.filter(a => a.rol === "t" && Math.abs(a.x) >= 0.05)
      .sort((p, q) => q.y - p.y)[0];
    if (!tAg) continue;
    const x0 = ib * d.sep;
    g.add(makeDim(V(x0, tAg.y, t), V(x0 + tAg.x, tAg.y, t), ARR,
                  dimScale * 0.12, "desvío", Math.abs(tAg.x)));
  }




  const COTAS_AISLADOR = false;




  if (COTAS_AISLADOR && ais && fondo > 0){
    const xd = (ais.tipo === "b") ? (ais.left + ais.ancho)
                                  : ((d.fases.length - 1) * d.sep + ais.diam / 2);
    const yf = L - ais.filas[0] - (ais.tipo === "b" ? ais.alto : ais.diam);


    const kF = Math.max(6, ((ais.tipo === "b") ? ais.ancho : ais.diam) * 0.075);
    g.add(makeDim(V(xd, yf, -fondo), V(xd, yf, 0), DER, kF, "fondo", fondo));
  }








  if (COTAS_AISLADOR && ais && ais.tipo === "b" && !pieza){




    const n = d.fases.length;
    const agsB = b.agujeros.filter(a => a.rol === "a")
      .sort((p, q) => p.desdeArriba - q.desdeArriba);
    const x0 = ais.left, x1 = ais.left + ais.ancho;
    const yTop = L - ais.filas[0], yBot = yTop - ais.alto;
    const kB = ais.ancho * 0.075, ARRIBA = V(0, 1, 0);
    g.add(makeDim(V(x0, yBot, 0), V(x1, yBot, 0), ABAJO,
                  kB * 1.00, "ancho ais", ais.ancho));
    g.add(makeDim(V(x0, yBot, 0), V(x0, yTop, 0), IZQ,
                  kB * 1.00, "alto ais", ais.alto));
    for (let i = 0; i + 1 < n; i++)
      g.add(makeDim(V(i * d.sep, yTop, 0), V((i + 1) * d.sep, yTop, 0), ARRIBA,
                    kB * 0.80, "paso ais", d.sep));



    if (agsB.length){
      const yAg = L - agsB[0].desdeArriba, dAg = (2 * agsB[0].r).toFixed(2);
      const rb = AIS_3F.rebaje, cj = AIS_3F.cajaFij;
      g.add(makeNota(V((n - 1) * d.sep, yAg, 0), V(1, 1, 0),
                     kB * 3.20, "ø agujeros", n + " × Ø" + dAg));


      g.add(makeNota(V(0, yAg, 0), V(-1, -1, 0), kB * 3.20, "ø rebaje",
                     n + " × Ø" + dAg + " · rebaje Ø" + rb.diam + " × " + rb.hondo));


      if (n === 4){
        const cxB = ais.left + ais.ancho / 2, fj = AIS_4F.fijacion;
        g.add(makeDim(V(cxB - fj, yTop, 0), V(cxB + fj, yTop, 0), ARRIBA,
                      kB * 1.75, "fijación", 2 * fj));
        g.add(makeNota(V(cxB + fj, yAg, 0), V(1, -1, 0), kB * 4.40, "ø fijación",
                       "2 × Ø" + dAg + " · rebaje Ø" + cj.diam + " × " + cj.hondo));
        g.add(makeNota(V(cxB - fj, yAg, 0), V(-1, 1, 0), kB * 4.40, "ø fij abajo",
                       "2 × Ø" + dAg));
      }
    }
  }

  if (COTAS_AISLADOR && pieza && ais && ais.tipo === "b"){
    const agsAis = b.agujeros.filter(a => a.rol === "a")
      .sort((p, q) => p.desdeArriba - q.desdeArriba);
    if (agsAis.length){
      const n = d.fases.length, cx = (n - 1) * d.sep / 2;
      const cy = L - agsAis[0].desdeArriba;
      const hx = pieza.largo / 2, hy = pieza.ancho / 2, ARRIBA = V(0, 1, 0);
      const xExt = (n - 1) * pieza.paso / 2;                                    





      const kA = 2 * hx * 0.075;

      g.add(makeDim(V(cx - hx, cy - hy, 0), V(cx + hx, cy - hy, 0), ABAJO,
                    kA * 2.60, "ancho ais", 2 * hx));




      for (let i = 0; i + 1 < n; i++)
        g.add(makeDim(V(cx - xExt + i * pieza.paso, cy + hy, 0),
                      V(cx - xExt + (i + 1) * pieza.paso, cy + hy, 0), ARRIBA,
                      kA * 0.80, "paso ais", pieza.paso));
      g.add(makeDim(V(cx - pieza.fijacion, cy + hy, 0),
                    V(cx + pieza.fijacion, cy + hy, 0), ARRIBA,
                    kA * 1.75, "fijación", 2 * pieza.fijacion));







      const cj = pieza.cajaFij, rb = pieza.rebaje;
      g.add(makeNota(V(cx + xExt, cy, 0), V(1, 1, 0), kA * 3.10,
                     "ø asientos", n + " × Ø" + pieza.agujero));
      g.add(makeNota(V(cx + pieza.fijacion, cy, 0), V(1, -1, 0), kA * 4.30,
                     "ø fijación", "2 × Ø" + pieza.agujero +
                     " · rebaje Ø" + cj.diam + " × " + cj.hondo));

      g.add(makeNota(V(cx - xExt, cy, 0), V(-1, -1, 0), kA * 3.10,
                     "ø rebaje", n + " × Ø" + pieza.agujero +
                     " · rebaje Ø" + rb.diam + " × " + rb.hondo));
      g.add(makeNota(V(cx - pieza.fijacion, cy, 0), V(-1, 1, 0), kA * 4.30,
                     "ø fij abajo", "2 × Ø" + pieza.agujero));

      g.add(makeDim(V(cx - hx, cy - hy, -pieza.asiento), V(cx - hx, cy - hy, 0), IZQ,
                    kA * 0.70, "asiento", pieza.asiento));
      g.add(makeDim(V(cx - hx, cy - hy, 0), V(cx - hx, cy + hy, 0), IZQ,
                    kA * 1.55, "alto ais", 2 * hy));
    }
  }






  if (puntasIG && puntasIG.length > 1){



    const yP = Math.max(...puntasIG.map(q => q.y)), zP = puntasIG[0].z;
    for (let k = 0; k + 1 < puntasIG.length; k++)
      g.add(makeDim(V(puntasIG[k].x, yP, zP), V(puntasIG[k + 1].x, yP, zP),
                    V(0, 1, 0), dimT * 0.75, "paso",
                    Math.abs(puntasIG[k + 1].x - puntasIG[k].x)));
  }






  if (cimaIG !== null){
    const yC = (puntasIG && puntasIG.length) ? Math.max(...puntasIG.map(q => q.y)) : L;
    g.add(makeDim(V(-hw, yC, -fondo), V(-hw, yC, cimaIG), IZQ,
                  dimT * 1.6, "altura", cimaIG + fondo));
  }

  holder.add(g);
  dims = g;
  setDimsVisible($("bCota").classList.contains("on"));
}


























function pieDeFijacion(obj){
  obj.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  let yMin = Infinity;
  const pts = [];
  obj.traverse(o => {
    if (!o.isMesh) return;
    const P = o.geometry.attributes.position;
    for (let i = 0; i < P.count; i++){
      v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld);
      pts.push(v.clone());
      if (v.y < yMin) yMin = v.y;
    }
  });
  if (!pts.length) return null;


  const alRas = h => h.ymin < yMin + 0.2;
  const ran = findRanuras(obj).filter(alRas);
  if (ran.length) return {cx:ran[0].cx, cz:ran[0].cz, y:yMin,
                          yTop:ran[0].ymax, paso:ran[0].ancho};
  const ag = findHoles(obj).filter(alRas);
  if (ag.length) return {cx:ag[0].cx, cz:ag[0].cz, y:yMin,
                         yTop:ag[0].ymax, paso:2 * ag[0].r};

  const bb = new THREE.Box3().setFromPoints(pts.filter(q => q.y < yMin + 0.05));
  return {cx:(bb.min.x + bb.max.x) / 2, cz:(bb.min.z + bb.max.z) / 2, y:yMin, paso:0};
}




async function armarConector(mc, herr){



  let base = null, edit;
  if (mc.mallaCatalogo){
    const r = mc.mallaCatalogo();
    if (r.isMesh) edit = r; else { base = r.base; edit = r.edit; }
  } else {
    [base, edit] = await Promise.all([
      mc.base ? loadPart(mc.base.url) : Promise.resolve(null),
      loadPart(mc.edit.url),
    ]);
  }
  paint(edit, mc.edit.color);
  const g = new THREE.Group();


  const tor = new THREE.Group();
  let xPlaca = 0;

  if (mc.base){
    paint(base, mc.base.color);
    g.add(base);

    const hb = base.userData.agujeros || findHoles(base);
    const he = edit.userData.agujeros || findHoles(edit);
    if (!hb.length || !he.length) return null;
    const A = hb.reduce((x, h) => h.ymax > x.ymax ? h : x);                   
    const B = he.reduce((x, h) => h.ymin < x.ymin ? h : x);
    const sub = new THREE.Group();
    sub.position.set(A.cx, A.ymax, A.cz);


    if (!mc.mallaCatalogo) sub.rotation.y = Math.PI / 2;
    edit.position.set(-B.cx, -B.ymin, -B.cz);
    sub.add(edit);
    g.add(sub);
    xPlaca = A.cx;




    apilar(tor, herr, A.cx, A.ymax + (B.ymax - B.ymin), A.cz);
  } else {
    g.add(edit);                                                            
  }


  const pie = (base && base.userData.pie) || pieDeFijacion(g);
  if (!pie) return null;
  g.userData.pie = pie;
  g.userData.yBase = pie.y;







  const torPie = new THREE.Group();
  if (typeof pie.yTop === "number") apilar(torPie, herr, pie.cx, pie.yTop, pie.cz);
  g.userData.tor = tor.children.length ? tor : null;
  g.userData.torPie = torPie.children.length ? torPie : null;



  g.userData.alcance = xPlaca - pie.cx;
  return g;
}





function apilar(destino, herr, x, yCara, z){
  if (!herr) return;
  let y = yCara;


  if (herr.plana){
    const pl = herr.plana.o.clone();
    pl.position.set(x, y - herr.plana.y0, z);
    destino.add(pl);
    y += herr.plana.y1 - herr.plana.y0;
  }
  const ar = herr.ara.o.clone();
  ar.position.set(x, y - herr.ara.y0, z);
  destino.add(ar);
  y += herr.ara.y1 - herr.ara.y0;
  const t = herr.tor.o.clone();
  t.position.set(x, y, z);
  destino.add(t);
}












function pernosAislador(herr, agsA, b, d, fondo){
  const g = new THREE.Group();
  for (const a of agsA){
    const cy = b.largo - a.desdeArriba;
    for (let i = 0; i < d.fases.length; i++){
      const arriba = new THREE.Group();
      apilar(arriba, herr, 0, 0, 0);
      arriba.rotation.x = Math.PI / 2;                                         
      arriba.position.set(i * d.sep, cy, b.espesor);
      g.add(arriba);
      const abajo = new THREE.Group();
      apilar(abajo, herr, 0, 0, 0);
      abajo.rotation.x = -Math.PI / 2;                                    
      abajo.position.set(i * d.sep, cy, -fondo);
      g.add(abajo);
    }
  }
  return g;
}








function tornillosAisladorBase(herr, agsA, b, d, ficha, fondo){
  const g = new THREE.Group();
  const zCabeza = ficha ? (-ficha.asiento + ficha.rebaje.hondo) : -fondo;
  for (const a of agsA){
    const cy = b.largo - a.desdeArriba;
    for (let i = 0; i < d.fases.length; i++){
      const x = i * d.sep;


      const t = herr.tor.o.clone();
      t.rotation.x = -Math.PI / 2;
      t.position.set(x, cy, zCabeza);
      g.add(t);
      const cima = new THREE.Group();
      let y = 0;
      for (const h of [herr.plana, herr.ara, herr.tuerca]){
        const o = h.o.clone();
        o.position.set(0, y - h.y0, 0);
        cima.add(o);
        y += h.y1 - h.y0;
      }
      cima.rotation.x = Math.PI / 2;                                        
      cima.position.set(x, cy, b.espesor);
      g.add(cima);
    }
  }
  return g;
}













function plantarConector(plant, barX, eje, zCara, lado, corr){


  const pie = plant.userData.pie;
  const sitio = [barX - lado * pie.cx, eje + lado * pie.cz,
                 zCara - plant.userData.yBase];








  const copia = (fuente, corrido) => {
    const giro = new THREE.Group();
    giro.add(fuente.clone(true));                                             
    if (lado < 0) giro.rotation.y = Math.PI;
    const tumbado = new THREE.Group();
    tumbado.add(giro);
    tumbado.rotation.x = Math.PI / 2;
    tumbado.position.set(sitio[0] + (corrido ? (corr || 0) : 0), sitio[1], sitio[2]);
    return tumbado;
  };

  const herraje = new THREE.Group();
  if (plant.userData.tor)    herraje.add(copia(plant.userData.tor, true));
  if (plant.userData.torPie) herraje.add(copia(plant.userData.torPie, false));
  return {cobre: copia(plant, true),
          herraje: herraje.children.length ? herraje : null};
}

           metalness:0.55, roughness:0.42}));


        const a0 = m.agujeros.reduce((x, h) => h.p[0] < x.p[0] ? h : x);
        giro = giroGen;




        hx = a0.p[0]; hy = a0.p[1] - C1.espesor / 2; hz = a0.p[2];
        punta = new THREE.Vector3(m.refB[0], m.refB[1], m.refB[2]);

          pliegue = m.pliegue; codos++;
          alfaLo = Math.min(alfaLo, Math.abs(m.alfa)); alfaHi = Math.max(alfaHi, Math.abs(m.alfa));
          deLado = Math.max(deLado, Math.abs(m.latF));
          giroMax = Math.max(giroMax, Math.abs(m.giro) * 180 / Math.PI);
          corrio = Math.max(corrio, m.corrio);
          if (m.enS) {
            enS = true; cantoMax = Math.max(cantoMax, m.canto || 0);

            sobraS = Math.max(sobraS, m.alturaMin - entreObj);
          }
        }
      }











      const tor = new THREE.Group();
      const pila = new THREE.Group();

      apilar(pila, {ara:herr.ara, tor:herr.tor}, 0, 0, 0);
      pila.rotation.x = Math.PI;
      pila.position.set(hx, hy - b.espesor, hz);
      tor.add(pila);



      let yCima = hy + C1.espesor;
      for (const h of [herr.plana, herr.ara, herr.tuerca]){
        const o = h.o.clone();
        o.position.set(hx, yCima - h.y0, hz);
        tor.add(o);
        yCima += h.y1 - h.y0;
      }







      const vuelta = m.giro ? -m.giro : 0;
      const M = new THREE.Matrix4().makeRotationZ(vuelta).multiply(giro);
      const agujero = new THREE.Vector3(hx, hy, hz);
      for (const e of emp){
        const yE = b.largo - e.desdeArriba;
        const pos = new THREE.Vector3(i * d.sep, yE, b.espesor + alzada(b, yE));
        puntas.push(punta.clone().sub(agujero).applyMatrix4(M).add(pos));
        const copia = fuente => {
          const c = fuente.clone(true);
          c.position.set(-hx, -hy, -hz);
          const q = new THREE.Group();
          q.quaternion.setFromRotationMatrix(giro);
          q.add(c);
          const g = new THREE.Group();
          g.rotation.z = vuelta;
          g.position.copy(pos);
          g.add(q);
          return g;
        };
        gIG.add(copia(malla));
        if (tor.children.length) gPin.add(copia(tor));
      }
    }



    if (sLat) sLat.out.textContent = (+sLat.input.value).toFixed(1) + " mm";
    if (oCorr) oCorr.textContent = d.fases.map(f =>
      f + " " + (d.alIG[f] >= 0 ? "+" : "") + d.alIG[f].toFixed(1)).join(" · ");
    oHasta.textContent = entreUsado.toFixed(1) + " mm" +
      ((typeof d.hastaIG === "number") ? " · del dibujo" : " · de la recta de catálogo");



    oLat.textContent = codos
      ? (enS
         ? (codos + " como el dibujo: rectos sobre la barra, en S de canto a " +
            cantoMax.toFixed(0) + "° (R40) hasta la columna del borne, " +
            corrio.toFixed(1) + " de lado" + (rectos ? " + " + rectos + " recto" : "") +
            (sobraS > 0.5 ? " · con esas curvas la pieza sube " + sobraS.toFixed(0) +
                            " mm más que el dibujo: el trapecio del 2D es corto para ese corrimiento" : ""))
         : (codos + " acodados a " + (Math.abs(alfaHi - alfaLo) < 0.5 ? alfaHi.toFixed(0)
                                    : alfaLo.toFixed(0) + "–" + alfaHi.toFixed(0)) + "° (pliegue " +
            pliegue.toFixed(0) + "°, " + deLado.toFixed(1) + " de lado) girados " +
            giroMax.toFixed(1) + "° sobre el perno, punta rolada a plomo" +
            (rectos ? " + " + rectos + " recto" : "")))
      : (rectos + " rectos");
    if (anchoUsado !== null)
      oLat.textContent += " · pletina de " + anchoUsado.toFixed(0) + " mm";
    if (rebajada !== null)
      oLat.textContent += " · punta rebajada a " + rebajada.toFixed(0) + " mm, sin agujero";



    if (!aviso && codos && corrio < pedido - 0.05)
      aviso = "el doblez solo se corre " + corrio.toFixed(1) +
              " mm: no da para el paso pedido";
    if (!aviso && entreUsado > entreObj + 0.1)
      aviso = "la pieza no cabe en " + entreObj.toFixed(1) +
              " mm hasta el borne: suben las tres a " + entreUsado.toFixed(1);
    oAviso.textContent = aviso || "—";



    puntasIG = puntas.sort((p, q) => p.x - q.x);


    holder.updateMatrixWorld(true);
    const cima = new THREE.Box3().setFromObject(gIG);
    if (gPin && gPin.children.length) cima.union(new THREE.Box3().setFromObject(gPin));


    cimaIG = cima.isEmpty() ? null : cima.max.y - holder.position.y;
    if (recotar) recotar();
  }



  const rehacerAlCuadro = porCuadro(rehacer);
  if (sLat) sLat.input.oninput = () => { memoria.latIG = +sLat.input.value; rehacerAlCuadro(); };
  sAlt.input.oninput = () => { leerSalto(); memoria.saltoIG = saltoIG; rehacerAlCuadro(); };
  rehacer();

  if (pin.children.length){
    pin.visible = $("bPin").classList.contains("on");
    $("bPin").classList.remove("off");
  }
  card({color:mc.edit.color, label:mc.edit.label});
  if (mrt) card({color:mrt.edit.color, label:mrt.edit.label});

  return {rehacer: () => { seguirBarra(); rehacer(); }};
}

async function montarS(m, mia){

  const sBase  = addSlider('Base', 15, 60, FS.base, true, K('baseS'));
  const sRecto = addSlider('Recto', 15, 90, FS.recto, true, K('recto'));
  const sCab   = addSlider('Cabeza por lado', 5, 25, FS.cabeza, true, K('cabeza'));


  const chkCab = recta ? null
    : addCheck('Editar cabeza', K('anchoCabOn'), on => { verCabeza(on); rehacer(); });
  const sAnc = recta ? null
    : addSlider('Ancho de cabeza', FS.cuello, FS.ancho, FS.cuello, true, K('anchoCab'), 0.1);
  const sPun = recta ? null
    : addSlider('Radio de punta', 0, FS.radioPunta, FS.radioPunta, true, K('radioPunta'), 0.1);
  const chkCurva = recta ? null
    : addCheck('Curva del escalón', K('curvaEsc'), () => rehacer(), true);

  };
  if (!recta) verCabeza(chkCab.checked);

  let malla = null;
  function rehacer(){
    const on = !!(chkCab && chkCab.checked);
    const o = {
      alto:+sAlto.input.value, base:+sBase.input.value, recto:+sRecto.input.value,
      cabeza:+sCab.input.value,
      inclinacion: (chkPata && chkPata.checked) ? 0 : FS.inclinacion,
      cuello: on ? +sAnc.input.value : FS.cuello,
      radioPunta: on ? Math.min(+sPun.input.value, +sAnc.input.value / 2) : FS.radioPunta,
      curvaEscalon: on ? chkCurva.checked : FS.curvaEscalon !== false,
    };

    if (sPun) sPun.input.max = (o.cuello / 2).toFixed(2);
    let c;
    try { c = construirConectorS(THREE, Object.assign({}, FS, o)); }
    catch (e){ return fail(e.message); }
    $('err').classList.remove('show');
    if (malla){ malla.removeFromParent(); malla.geometry.dispose(); }
    malla = new THREE.Mesh(c.geo, mat);
    holder.add(malla);
    partMesh = malla; piezas = [malla];


    const muestra = (sl, v) => { if (sl) sl.out.textContent = v.toFixed(1) + ' mm'; };
    muestra(sAlto, o.alto);   muestra(sBase, o.base);
    muestra(sRecto, o.recto); muestra(sCab, o.cabeza);
    muestra(sAnc, o.cuello);  muestra(sPun, o.radioPunta);
    oInc.textContent = c.inclinacion.toFixed(2) + '°' +
      (c.inclinacion < 0.005 ? ' · rectas' : ' · convergen ' +
        (c.pata * Math.sin(c.inclinacion * Math.PI / 180)).toFixed(2) + ' mm en ' +
        c.pata.toFixed(2));


    oDev.textContent = c.desarrollo.toFixed(1) + ' mm';
    cotasS(c, o);
  }



  function cotasS(c, o){
    clearDims();
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const W = c.ancho, t = c.espesor, L = c.largo, top = c.alto - t;
    const ARRIBA = V(0, 1, 0), ABAJO = V(0, -1, 0), IZQ = V(-1, 0, 0);
    dimScale = Math.max(8, 0.6 * Math.max(L, 20));
    const k = dimScale;
    const g = new THREE.Group();
    g.add(makeDim(V(-L / 2, -t, W), V(-L / 2, top, W), IZQ, k * 0.35, 'alto', c.alto));
    g.add(makeDim(V(-o.base / 2, -t, W), V(o.base / 2, -t, W), ABAJO, k * 0.30, 'base', o.base));
    g.add(makeDim(V(-o.recto / 2, top, W), V(o.recto / 2, top, W), ARRIBA, k * 0.30,
                  'recto', o.recto));
    for (const sg of [-1, 1])
      g.add(makeDim(V(sg * o.recto / 2, top, W), V(sg * L / 2, top, W), ARRIBA, k * 0.30,
                    'cabeza', o.cabeza));
    g.add(makeDim(V(-L / 2, top, W), V(L / 2, top, W), ARRIBA, k * 0.62, 'ancho', L, true));


    const rE = (W - o.cuello) / 2, rP = Math.min(o.radioPunta, o.cuello / 2);
    const xN = -((o.recto / 2 + rE) + (L / 2 - rP)) / 2;
    g.add(makeDim(V(xN, top, W / 2 - o.cuello / 2), V(xN, top, W / 2 + o.cuello / 2),
                  IZQ, k * 0.45, 'ancho cab', o.cuello));
    if (o.radioPunta > 0.05)
      g.add(makeNota(V(-L / 2, top, W / 2), V(-1, 1, 0), k * 0.55, 'punta',
                     'R' + rP.toFixed(1)));



    if (c.inclinacion > 0.01){
      const P0 = V(c.pataIzq.p0[0], c.pataIzq.p0[1], W);
      const P1 = V(c.pataIzq.p1[0], c.pataIzq.p1[1], W);
      const ang = makeAng(P0, ABAJO, P0.clone().sub(P1), P0.distanceTo(P1) * 1.8,
                          'patas', c.inclinacion);
      if (ang) g.add(ang);
    }
    holder.add(g);
    dims = g;
    setDimsVisible($('bCota').classList.contains('on'));
  }



  const liga = (sl, clave) => {
    if (!sl) return;
    sl.input.oninput = () => { memoria[clave] = +sl.input.value; rehacer(); };
  };
  liga(sAlto, K('alto')); liga(sBase, K('baseS')); liga(sRecto, K('recto'));
  liga(sCab, K('cabeza')); liga(sAnc, K('anchoCab')); liga(sPun, K('radioPunta'));
  rehacer();
  frame();
}

  const filaDe = sl => sl.input.closest('.ctl');
  const verP1 = on => { if (sSal) filaDe(sSal).style.display = on ? '' : 'none'; };
  const verP2 = on => {
    if (recta) return;
    for (const sl of [sAnc, sPun]) filaDe(sl).style.display = on ? '' : 'none';
    chkCurva.closest('label').style.display = on ? '' : 'none';
  };
  if (!recta){ verP1(chkP1.checked); verP2(chkP2.checked); }

  let piezasRT = null;
  function rehacer(){
    const on2 = !!(chkP2 && chkP2.checked);
    const oS = {alto:+sAlto.input.value,
                saliente: (chkP1 && chkP1.checked) ? +sSal.input.value : ficha.saliente};
    const oP = {recto:+sRecto.input.value, cabeza:+sCab.input.value,
                cuello: on2 ? +sAnc.input.value : FR.placa.cuello,
                radioPunta: on2 ? Math.min(+sPun.input.value, +sAnc.input.value / 2)
                                : FR.placa.radioPunta,
                curvaEscalon: on2 ? chkCurva.checked : FR.placa.curvaEscalon !== false};
    if (sPun) sPun.input.max = (oP.cuello / 2).toFixed(2);
    let r;
    try { r = mallaRT(m.id, {soporte:oS, placa:oP}, mat); }
    catch (e){ return fail(e.message); }
    $('err').classList.remove('show');
    if (piezasRT){
      for (const o of [piezasRT.base, piezasRT.edit]){ o.removeFromParent(); o.geometry.dispose(); }
      if (pin){ pin.removeFromParent(); pin = null; }
    }
    piezasRT = r;
    const A = r.soporte.agujero;
    r.edit.position.set(A.cx, A.ymax, 0);
    holder.add(r.base);

    oDevT.textContent = (r.soporte.desarrollo + r.placa.desarrollo).toFixed(1) + ' mm';
    cotasRT(r, oS, oP);
  }




  function cotasRT(r, oS, oP){
    clearDims();
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const sop = r.soporte, pla = r.placa, W = sop.ancho, t = sop.espesor;
    const A = sop.agujero, yP = A.ymax + t, L = pla.largo;
    const ARRIBA = V(0, 1, 0), ABAJO = V(0, -1, 0), DER = V(1, 0, 0), IZQ = V(-1, 0, 0);
    dimScale = Math.max(8, 0.6 * Math.max(sop.largo, 20));
    const k = dimScale;
    const g = new THREE.Group();
    const xDer = Math.max(sop.largo, A.cx + L / 2);
    g.add(makeDim(V(xDer, -t, W), V(xDer, yP, W), DER, k * 0.30, 'alto', sop.alto));
    g.add(makeDim(V(A.cx - oP.recto / 2, yP, W), V(A.cx + oP.recto / 2, yP, W), ARRIBA,
                  k * 0.25, 'recto', oP.recto));
    for (const sg of [-1, 1])
      g.add(makeDim(V(A.cx + sg * oP.recto / 2, yP, W), V(A.cx + sg * L / 2, yP, W), ARRIBA,
                    k * 0.25, 'cabeza', oP.cabeza));
    g.add(makeDim(V(A.cx - L / 2, yP, W), V(A.cx + L / 2, yP, W), ARRIBA, k * 0.52,
                  'ancho', L, true));
    const rE = (W - oP.cuello) / 2, rP = Math.min(oP.radioPunta, oP.cuello / 2);
    const xN = A.cx - ((oP.recto / 2 + rE) + (L / 2 - rP)) / 2;
    g.add(makeDim(V(xN, yP, W / 2 - oP.cuello / 2), V(xN, yP, W / 2 + oP.cuello / 2),
                  IZQ, k * 0.40, 'ancho cab', oP.cuello));
    if (oP.radioPunta > 0.05)
      g.add(makeNota(V(A.cx - L / 2, yP, W / 2), V(-1, 1, 0), k * 0.5, 'punta',
                     'R' + rP.toFixed(1)));


    g.add(makeDim(V(sop.pie.cx, -t, W), V(A.cx, -t, W), ABAJO, k * 0.45, 'alcance',
                  sop.alcance, true));
    if (oS.saliente > 0.05)
      g.add(makeDim(V(0, -t, W), V(oS.saliente, -t, W), ABAJO, k * 0.22, 'saliente',
                    oS.saliente));
    holder.add(g);
    dims = g;
    setDimsVisible($('bCota').classList.contains('on'));
  }



  const liga = (sl, clave) => {
    if (!sl) return;
    sl.input.oninput = () => { memoria[clave] = +sl.input.value; rehacer(); };
  };
  liga(sAlto, K('alto')); liga(sRecto, K('recto')); liga(sCab, K('cabeza'));
  liga(sSal, K('saliente')); liga(sAnc, K('anchoCab')); liga(sPun, K('radioPunta'));
  rehacer();
  frame();
}

                                                   polygonOffsetFactor:1, polygonOffsetUnits:1});
const MAT_DIB_LINEA = new THREE.LineBasicMaterial({color:0x111111});
const MAT_DIB_BORDE = new THREE.MeshBasicMaterial({color:0x111111, side:THREE.BackSide});
const FONDO_DIBUJO = new THREE.Color(0xffffff), FONDO_NORMAL = new THREE.Color(0xe2e6ec);
const GROSOR_BORDE = 0.25;                                                            




function lineasPara(geo, escala){




  const clave = geo.uuid + "@" + escala.toFixed(6) + "@" +
                geo.attributes.position.version;
  let l = lineasDe.get(clave);
  if (l) return l;
  const aristas = new THREE.EdgesGeometry(geo, 20);


  const p = geo.attributes.position, n = geo.attributes.normal;
  const hin = new Float32Array(p.count * 3), d = GROSOR_BORDE / escala;
  for (let i = 0; i < p.count; i++){
    hin[3 * i]     = p.getX(i) + (n ? n.getX(i) : 0) * d;
    hin[3 * i + 1] = p.getY(i) + (n ? n.getY(i) : 0) * d;
    hin[3 * i + 2] = p.getZ(i) + (n ? n.getZ(i) : 0) * d;
  }
  const borde = new THREE.BufferGeometry();
  borde.setAttribute("position", new THREE.BufferAttribute(hin, 3));
  if (geo.index) borde.setIndex(geo.index);
  l = {aristas, borde};
  lineasDe.set(clave, l);
  return l;
}
function aplicarDibujo(){
  scene.background = modoDibujo ? FONDO_DIBUJO : FONDO_NORMAL;
  const v = new THREE.Vector3();
  asm.traverse(o => {
    if (!o.isMesh || o.userData.esLinea) return;
    if (modoDibujo && !o.userData.dibujo){
      const escala = o.getWorldScale(v).x || 1;
      const l = lineasPara(o.geometry, escala);
      const a = new THREE.LineSegments(l.aristas, MAT_DIB_LINEA);
      const b = new THREE.Mesh(l.borde, MAT_DIB_BORDE);
      a.userData.esLinea = b.userData.esLinea = true;
      o.add(a, b);
      o.userData.dibujo = {a, b, mat:o.material, ver:o.geometry.attributes.position.version};
      o.material = MAT_DIB_CARA;
    } else if (modoDibujo && o.userData.dibujo &&
               o.userData.dibujo.ver !== o.geometry.attributes.position.version){

      const d = o.userData.dibujo;
      o.remove(d.a, d.b);
      const escala = o.getWorldScale(v).x || 1;
      const l = lineasPara(o.geometry, escala);
      const a = new THREE.LineSegments(l.aristas, MAT_DIB_LINEA);
      const b = new THREE.Mesh(l.borde, MAT_DIB_BORDE);
      a.userData.esLinea = b.userData.esLinea = true;
      o.add(a, b);
      o.userData.dibujo = {a, b, mat:d.mat, ver:o.geometry.attributes.position.version};
    } else if (!modoDibujo && o.userData.dibujo){
      const d = o.userData.dibujo;
      o.remove(d.a, d.b);
      o.material = d.mat;
      delete o.userData.dibujo;
    }
  });
}

                      clave: el.classList.contains("key")});

  }

function caraCubo(txt){
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = "#b8c2d0"; g.lineWidth = 5; g.strokeRect(2.5, 2.5, 123, 123);
  g.fillStyle = "#16202e";
  g.font = '600 20px "Segoe UI",system-ui,Arial,sans-serif';
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(txt, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}



const CUBO_CARAS = ["DCHA", "IZQDA", "PLANTA", "ABAJO", "FRENTE", "ATRÁS"];
const cuboMats = CUBO_CARAS.map(t => new THREE.MeshBasicMaterial({map: caraCubo(t)}));
const cubo = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), cuboMats);
escCubo.add(cubo);
escCubo.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(cubo.geometry),
  new THREE.LineBasicMaterial({color: 0x5b6778})));

const rayCubo = new THREE.Raycaster();
let caraSobre = -1;







function regionCubo(){
  const s = CUBO_LADO, W = canvas.clientWidth;
  const x = W - 16 - s;
  const y = Math.round($("arribaDer").getBoundingClientRect().bottom) + CUBO_AIRE;
  const libre = $("side").getBoundingClientRect().right + CUBO_AIRE;
  return (x < libre) ? null : {x, y, s};
}





function zonaCubo(ev){
  const R = regionCubo();
  if (!R) return null;
  const dx = ev.clientX - R.x, dy = ev.clientY - R.y;
  if (dx < 0 || dy < 0 || dx > R.s || dy > R.s) return null;
  rayCubo.setFromCamera(
    new THREE.Vector2(dx / R.s * 2 - 1, -(dy / R.s) * 2 + 1), camCubo);
  const h = rayCubo.intersectObject(cubo, false)[0];
  if (!h) return {fuera: true};
  const p = h.point, T = 0.34;
  const v = new THREE.Vector3(
    Math.abs(p.x) > T ? Math.sign(p.x) : 0,
    Math.abs(p.y) > T ? Math.sign(p.y) : 0,
    Math.abs(p.z) > T ? Math.sign(p.z) : 0);
  if (v.lengthSq() === 0) return {fuera: true};
  return {dir: v, cara: h.face.materialIndex};
}



function sobreCubo(i){
  if (i === caraSobre) return;
  if (caraSobre >= 0) cuboMats[caraSobre].color.set(0xffffff);
  caraSobre = i;
  if (i >= 0) cuboMats[i].color.set(0xffdcb5);
  canvas.style.cursor = (i >= 0) ? "pointer" : "";
}




canvas.addEventListener("pointerdown", ev => {
  const z = zonaCubo(ev);
  if (!z) return;
  ev.stopPropagation();
  ev.preventDefault();
  if (z.dir) frame(null, z.dir);
}, true);
canvas.addEventListener("pointermove", ev => {
  const z = zonaCubo(ev);
  sobreCubo(z && z.cara !== undefined ? z.cara : -1);
});
canvas.addEventListener("pointerleave", () => sobreCubo(-1));


$('bDetalles').onclick = e => {
  const recogido = $('side').classList.toggle('recogido');
  e.target.textContent = recogido ? 'Ver detalles' : 'Ocultar detalles';
};






function encuadrarOrto(){
  const h = orto.userData.halfH || 1, w = h * camera.aspect;
  orto.left = -w; orto.right = w; orto.top = h; orto.bottom = -h;
  orto.updateProjectionMatrix();
}












function fraccionTapada(W){
  return 0;
}

function correrVista(){
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!(W > 0 && H > 0)) return;
  const tapado = fraccionTapada(W);
  const dx = Math.round(W * tapado / 2);
  camera.setViewOffset(W, H, dx, 0, W, H);
  orto.setViewOffset(W, H, dx, 0, W, H);
}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  labels.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  encuadrarOrto();
  correrVista();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  if (modoDibujo) aplicarDibujo();                                            
  controls.update();
  renderer.render(scene, ojo);
  labels.render(scene, ojo);
  pintarCubo();
});






let casaEn = '';
function ubicarCasa(R){
  let x, y;
  if (R){ x = Math.round(R.x - 6); y = Math.round(R.y - 6); }
  else {
    const a = $('arribaDer').getBoundingClientRect();
    x = Math.round(a.left - 30); y = Math.round(a.top + (a.height - 24) / 2);
  }
  const k = x + ',' + y;
  if (k === casaEn) return;
  casaEn = k;
  const b = $('bReset');
  b.style.left = x + 'px';
  b.style.top = y + 'px';
}






function pintarCubo(){
  const R = regionCubo();
  ubicarCasa(R);
  if (!R) return;
  const d = ojo.position.clone().sub(controls.target);
  if (d.lengthSq() < 1e-9) return;
  camCubo.position.copy(d.normalize()).multiplyScalar(6);
  camCubo.up.copy(ojo.up);
  camCubo.lookAt(0, 0, 0);
  const yWebGL = canvas.clientHeight - R.y - R.s;




  const borraba = renderer.autoClear;
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.setScissorTest(true);
  renderer.setViewport(R.x, yWebGL, R.s, R.s);
  renderer.setScissor(R.x, yWebGL, R.s, R.s);
  renderer.render(escCubo, camCubo);
  renderer.setScissorTest(false);
  renderer.autoClear = borraba;
  renderer.setViewport(0, 0, canvas.clientWidth, canvas.clientHeight);
}



window.__3d = {renderer, scene, asm, get ojo(){ return ojo; }, controls};
</script>
